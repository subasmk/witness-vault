plugins { id 'com.android.application' }
android {
 namespace 'com.subasmk.witnessvault'
 compileSdk 35
 defaultConfig {
  applicationId 'com.subasmk.witnessvault'
  minSdk 26
  targetSdk 35
  versionCode 2
  versionName '1.1'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 signingConfigs {
  release {
   if (System.getenv("WITNESS_KEYSTORE")) {
    storeFile file(System.getenv("WITNESS_KEYSTORE"))
    storePassword new File(System.getenv("WITNESS_SIGNING_PASSWORD_FILE")).text.trim()
    keyAlias "witness"
    keyPassword new File(System.getenv("WITNESS_SIGNING_PASSWORD_FILE")).text.trim()
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   shrinkResources false
   signingConfig signingConfigs.release
   proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
   ndk { abiFilters "arm64-v8a" }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 androidResources { noCompress 'tflite' }
 packaging { resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] }
 testOptions { unitTests { returnDefaultValues = true; includeAndroidResources = true } }
}
dependencies {
 implementation 'androidx.fragment:fragment:1.8.5'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 implementation 'androidx.camera:camera-camera2:1.4.1'
 implementation 'androidx.camera:camera-lifecycle:1.4.1'
 implementation 'androidx.camera:camera-view:1.4.1'
 implementation 'com.google.mlkit:face-detection:16.1.7'
 implementation 'org.tensorflow:tensorflow-lite:2.16.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
